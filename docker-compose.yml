version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: buildable_land_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: buildable_land
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d buildable_land"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
